<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <title>Mayil Brand matchbox label</title>

  <rect x="12" y="10" width="278" height="182" fill="#2E3A87"/>
  <rect x="10" y="12" width="278" height="182" fill="#F2E8D5"/>

  <rect x="16" y="18" width="266" height="170" fill="none" stroke="#1A1512" stroke-width="3"/>
  <rect x="22" y="24" width="254" height="158" fill="none" stroke="#1A1512" stroke-width="1"/>

  <rect x="23" y="25" width="252" height="30" fill="#E5A50A"/>
  <text x="149" y="47" font-family="Arial Black, Arial, sans-serif" font-size="21"
        fill="#1A1512" text-anchor="middle" letter-spacing="2">MAYIL</text>

  <!-- Motif: a peacock. The tail fans out from behind the body, so it is
       drawn first and the bird is laid over the top of it. -->
  <g stroke="#14685A" stroke-width="3" stroke-linecap="round">
    <path d="M150 138 L99 127"/>
    <path d="M150 138 L109 106"/>
    <path d="M150 138 L127 91"/>
    <path d="M150 138 L150 86"/>
    <path d="M150 138 L173 91"/>
    <path d="M150 138 L191 106"/>
    <path d="M150 138 L201 127"/>
  </g>
  <g fill="#2E3A87">
    <circle cx="99" cy="127" r="8"/>
    <circle cx="109" cy="106" r="8"/>
    <circle cx="127" cy="91" r="8"/>
    <circle cx="150" cy="86" r="8"/>
    <circle cx="173" cy="91" r="8"/>
    <circle cx="191" cy="106" r="8"/>
    <circle cx="201" cy="127" r="8"/>
  </g>
  <g fill="#E5A50A">
    <circle cx="99" cy="127" r="3.5"/>
    <circle cx="109" cy="106" r="3.5"/>
    <circle cx="127" cy="91" r="3.5"/>
    <circle cx="150" cy="86" r="3.5"/>
    <circle cx="173" cy="91" r="3.5"/>
    <circle cx="191" cy="106" r="3.5"/>
    <circle cx="201" cy="127" r="3.5"/>
  </g>

  <!-- The bird itself -->
  <g fill="#1A1512">
    <ellipse cx="150" cy="132" rx="13" ry="16"/>
    <path d="M147 120 q-9 -8 -15 -17 l9 -6 q7 10 14 16 z"/>
    <circle cx="128" cy="100" r="8"/>
    <path d="M120 99 l-11 3.5 11 3.5 z"/>
  </g>
  <g stroke="#14685A" stroke-width="2" stroke-linecap="round">
    <path d="M126 91 v-8"/>
    <path d="M132 92 l3 -8"/>
    <path d="M121 93 l-4 -7"/>
  </g>
  <g fill="#E5A50A">
    <circle cx="126" cy="82" r="2.5"/>
    <circle cx="135" cy="83" r="2.5"/>
    <circle cx="117" cy="85" r="2.5"/>
  </g>

  <rect x="23" y="152" width="252" height="30" fill="#14685A"/>
  <text x="149" y="172" font-family="Arial, Helvetica, sans-serif" font-size="15"
        font-weight="bold" fill="#F2E8D5" text-anchor="middle" letter-spacing="2">BEYOND CODE</text>
</svg>
