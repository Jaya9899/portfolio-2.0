<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <title>Filter Kaapi Brand matchbox label</title>

  <!-- Off-register printing: the coloured plate is nudged 2px off the paper plate.
       Real cheap-press matchbox labels misalign like this. -->
  <rect x="12" y="10" width="278" height="182" fill="#E5A50A"/>
  <rect x="10" y="12" width="278" height="182" fill="#F2E8D5"/>

  <!-- Double border rule -->
  <rect x="16" y="18" width="266" height="170" fill="none" stroke="#1A1512" stroke-width="3"/>
  <rect x="22" y="24" width="254" height="158" fill="none" stroke="#1A1512" stroke-width="1"/>

  <!-- Top brand band -->
  <rect x="23" y="25" width="252" height="30" fill="#14685A"/>
  <text x="149" y="47" font-family="Arial Black, Arial, sans-serif" font-size="20"
        fill="#F2E8D5" text-anchor="middle" letter-spacing="1">FILTER KAAPI</text>

  <!-- Motif: a steel tumbler standing in its davara -->
  <g stroke="#1A1512" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M140 66 q7 -9 0 -18"/>
    <path d="M150 64 q7 -10 0 -20"/>
    <path d="M160 66 q7 -9 0 -18"/>
  </g>
  <g fill="#1A1512">
    <!-- tumbler -->
    <rect x="132" y="74" width="36" height="8" rx="2"/>
    <path d="M136 82 L139 114 L161 114 L164 82 Z"/>
    <!-- davara: broad flat lip, then the shallow bowl under it -->
    <path d="M104 120 L196 120 L184 130 L116 130 Z"/>
    <path d="M116 130 Q150 154 184 130 Z"/>
  </g>

  <!-- Corner stars -->
  <g fill="#A8340A">
    <path d="M40 128 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1 z"/>
    <path d="M260 128 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1 z"/>
  </g>

  <!-- Bottom band -->
  <rect x="23" y="152" width="252" height="30" fill="#A8340A"/>
  <text x="149" y="172" font-family="Arial, Helvetica, sans-serif" font-size="15"
        font-weight="bold" fill="#F2E8D5" text-anchor="middle" letter-spacing="3">ABOUT ME</text>
</svg>
