<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <title>Empty photo frame</title>

  <rect width="300" height="380" fill="#D4D0C8"/>

  <!-- Sunken bevel: dark on the top and left, light on the bottom and right -->
  <path d="M0 380 V0 H300 V4 H4 V380 Z" fill="#808080"/>
  <path d="M300 0 V380 H0 V376 H296 V0 Z" fill="#FFFFFF"/>
  <path d="M4 376 V4 H296 V8 H8 V376 Z" fill="#404040"/>
  <path d="M296 4 V376 H4 V372 H292 V4 Z" fill="#DFDFDF"/>

  <rect x="8" y="8" width="284" height="364" fill="#FFFFFF"/>

  <text x="150" y="182" font-family="Tahoma, Verdana, sans-serif" font-size="17"
        font-weight="bold" fill="#000000" text-anchor="middle">No photo yet</text>
  <text x="150" y="208" font-family="Tahoma, Verdana, sans-serif" font-size="13"
        fill="#404040" text-anchor="middle">Save yours as assets/jaya.jpg</text>
</svg>
